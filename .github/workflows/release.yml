name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          bun -e '
            import manifest from "./manifest.json";
            import pkg from "./package.json";
            import versions from "./versions.json";
            const version = process.env.RELEASE_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version ?? "")) throw new Error(`Invalid version tag: ${version}`);
            if (manifest.version !== version || pkg.version !== version || !versions[version]) {
              throw new Error("Tag, package.json, manifest.json, and versions.json must use the same version");
            }
          '
      - run: bun run check
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          main.js manifest.json
